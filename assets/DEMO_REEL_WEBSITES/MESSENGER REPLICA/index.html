<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Replica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="messenger-wrapper">
        <header class="main-header">
            <div class="header-top">
                <div class="menu-btn">☰</div>
                <h1>Chats</h1>
                <div class="header-actions">
                    <div class="action-icon">📷</div>
                    <div class="action-icon">✏️</div>
                </div>
            </div>

            <nav class="nav-tabs">
                <div class="tab active">Chats</div>
                <div class="tab">Calls</div>
                <div class="tab">Communities</div>
                <div class="tab">Stories</div>
            </nav>
        </header>

        <div class="search-section">
            <div class="search-box">
                <img src="https://via.placeholder.com/30" alt="Me" class="search-profile">
                <span class="search-placeholder">Search</span>
            </div>
        </div>

        <main class="chat-container">
            <div class="chat-row">
                <div class="avatar-wrapper">
                    <img src="../MESSENGER REPLICA/cid.jpeg" alt="User">
                    <div class="status-dot online"></div>
                </div>
                <div class="chat-details">
                    <div class="user-name">John Smith</div>
                    <div class="message-preview">You: checking the files now · 12:45 PM</div>
                </div>
                <div class="read-receipt">✓</div>
            </div>

            <div class="chat-row unread">
                <div class="avatar-wrapper">
                    <img src="../MESSENGER REPLICA/eren.jpeg" alt="User">
                    <div class="status-dot online"></div>
                </div>
                <div class="chat-details">
                    <div class="user-name">Rene Aeyger</div>
                    <div class="message-preview">Yo bro, check the rumbling outside · 1:23 PM</div>
                </div>
                <div class="unread-dot"></div>
            </div>

              <div class="chat-row unread">
                <div class="avatar-wrapper">
                    <img src="../MESSENGER REPLICA/nini.jpeg" alt="User">
                    <div class="status-dot online"></div>
                </div>
                <div class="chat-details">
                    <div class="user-name">Jane Smith</div>
                    <div class="message-preview">Onichan I'm stuck, help me :< · 11:20 PM</div>
                </div>
                <div class="unread-dot"></div>
            </div>
            
            <div class="chat-row unread">
                <div class="avatar-wrapper">
                    <img src="../MESSENGER REPLICA/rias.jpeg" alt="User">
                    <div class="status-dot online"></div>
                </div>
                <div class="chat-details">
                    <div class="user-name">Rias</div>
                    <div class="message-preview">sent a link. · 6:20 PM</div>
                </div>
                <div class="unread-dot"></div>
            </div>

            <div class="chat-row">
                <div class="avatar-wrapper">
                    <img src="../MESSENGER REPLICA/gc.jpeg" alt="User">
                </div>
                <div class="chat-details">
                    <div class="user-name">Project Group</div>
                    <div class="message-preview">Mark: Done with the CSS! · Wed</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
