<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="section left-pane">
            <div class="logo-container">
                <div class="logo-circle">
                    <div class="drop"></div>
                </div>
            </div>
            <div class="button-group mobile-only">
                <button class="btn-black">Log in</button>
                <button class="btn-black">Sign-up</button>
            </div>
        </div>

        <div class="section right-pane">
            <div class="login-box">
                <div class="logo-circle small-logo">
                    <div class="drop"></div>
                </div>
                <h3>Log in</h3>
                <form>
                    <input type="text" placeholder="Username" class="input-field">
                    <input type="password" placeholder="Password" class="input-field">
                    <div class="options">
                        <label><input type="checkbox"> Remember me</label>
                    </div>
                    <button type="submit" class="btn-black">Log in</button>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
